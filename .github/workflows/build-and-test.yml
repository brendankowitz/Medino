name: Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # GitVersion needs full history

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x
          11.0.x
        dotnet-quality: 'ga'

    - name: Restore dependencies
      run: dotnet restore src/Medino.slnx

    - name: Build
      run: dotnet build src/Medino.slnx --configuration Release --no-restore

    - name: Run tests (.NET 10)
      run: dotnet test src/Medino.slnx --framework net10.0 --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-net10.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults/net10

    - name: Run tests (.NET 11)
      run: dotnet test src/Medino.slnx --framework net11.0 --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-net11.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults/net11

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: 'TestResults/**/*.trx'

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-reports
        path: TestResults/**/coverage.cobertura.xml