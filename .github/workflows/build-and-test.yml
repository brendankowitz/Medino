name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # GitVersion needs full history

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
        dotnet-quality: 'ga'

    - name: Restore dependencies
      run: dotnet restore src/Medino.slnx

    - name: Build
      run: dotnet build src/Medino.slnx --configuration Release --no-restore

    - name: Run tests (.NET 10)
      run: dotnet test src/Medino.slnx --framework net10.0 --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-net10.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults/net10

    - name: Run tests (.NET 11)
      run: dotnet test src/Medino.slnx --framework net11.0 --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results-net11.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults/net11

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: 'TestResults/**/*.trx'

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: TestResults/**/coverage.cobertura.xml